<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Orgnl Media</title>

    <link rel="icon" href="../assets/favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="../assets/favicon/site.webmanifest">

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@300;400;500&display=swap');

        :root{

            --cream:#F4F3F1;
            --black:#181818;
            --orange:#FF5A00;
            --grey:#6f6f6f;

        }

        *{

            margin:0;
            padding:0;
            box-sizing:border-box;

        }

        body{

            min-height:100vh;

            background:var(--cream);

            color:var(--black);

            font-family:'Poppins',sans-serif;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:40px;

        }

        .wrapper{

            width:100%;

            max-width:760px;

        }

        h1{

            font-family:'Montserrat',sans-serif;

            font-size:5rem;

            line-height:.9;

            letter-spacing:-.04em;

            margin-bottom:28px;

        }

        p{

            max-width:520px;

            font-size:1rem;

            line-height:1.9;

            color:var(--grey);

        }

        a{

            display:inline-flex;

            align-items:center;

            gap:10px;

            margin-top:70px;

            font-family:'Montserrat',sans-serif;

            font-size:.78rem;

            font-weight:700;

            letter-spacing:.14em;

            text-transform:uppercase;

            color:var(--black);

            text-decoration:none;

            transition:.25s ease;

        }

        a:hover{

            color:var(--orange);

            transform:translateX(-6px);

        }

        @media(max-width:768px){

            h1{

                font-size:3rem;

            }

            a{

                margin-top:50px;

            }

        }

    </style>

</head>

<body>

    <main class="wrapper">

        <h1>

            Message<br>
            sent.

        </h1>

        <p>

            Thanks for reaching out.
            We'll read your message and get back to you as soon as we can.

        </p>

        <a href="../index.html">

            ← Back to Home

        </a>

    </main>

</body>

</html>
