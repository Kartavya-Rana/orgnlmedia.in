<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | Orgnl Media</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="icon" href="../assets/favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="../assets/favicon/site.webmanifest">

</head>

<body>



<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <div class="container">

        <a href="../index.html" class="logo">

            <img
                src="../assets/images/logo.png"
                alt="Orgnl Media"
            >

        </a>

        <nav>

            <a href="../index.html">
                Home
            </a>

            <a href="about.html">
                About Us
            </a>

        </nav>

    </div>

</header>



<!-- =========================================================
     CONTACT HERO
========================================================= -->

<section class="contact-page">

    <div class="container">

        <span class="section-number">
            Contact
        </span>

        <h1>

            Let's make
            something
            people remember.

        </h1>

        <p class="contact-intro">

            Whether it's a project, an idea, a collaboration,
            or simply a hello, we'd love to hear from you.

        </p>



        <!-- =====================================================
             FORM
        ====================================================== -->

        <form
            action="https://formsubmit.co/connect@orgnlmedia.in"
            method="POST"
            class="contact-form"
        >

            <!-- Disable Captcha -->

            <input
                type="hidden"
                name="_captcha"
                value="false"
            >

            <!-- Redirect -->

            <input
                type="hidden"
                name="_next"
                value="https://orgnlmedia.in/pages/thank-you.html"
            >

            <!-- Subject -->

            <input
                type="hidden"
                name="_subject"
                value="New Message from Orgnl Website"
            >



            <!-- NAME -->

            <div class="form-group">

                <label>

                    Name

                </label>

                <input
                    type="text"
                    name="Name"
                    required
                >

            </div>



            <!-- EMAIL -->

            <div class="form-group">

                <label>

                    Email Address

                </label>

                <input
                    type="email"
                    name="Email"
                    required
                >

            </div>



            <!-- PHONE -->

            <div class="form-group">

                <label>

                    Contact Number
            

                </label>

                <input
                    type="tel"
                    name="Phone"
                >

            </div>



            <!-- MESSAGE -->

            <div class="form-group">

                <label>

                    What would you like to tell us?

                </label>

                <textarea
                    name="Message"
                    rows="8"
                    required
                ></textarea>

            </div>



            <button
                type="submit"
                class="submit-button"
            >

                Send Message

            </button>

        </form>



        <!-- =====================================================
             DIRECT CONTACT
        ====================================================== -->

        <div class="contact-direct">

            <p>

                Prefer email?

            </p>

            <a href="mailto:connect@orgnlmedia.in">

                connect@orgnlmedia.in

            </a>

        </div>

    </div>

</section>



<!-- =========================================================
     FOOTER
========================================================= -->

<footer class="footer">

    <div class="container">

        <div class="footer-divider"></div>

        <div class="footer-bottom">

            <p>
                © 2026 ORGNL MEDIA
            </p>

            <p>
                Gandhinagar, Gujarat
            </p>

            <a href="mailto:connect@orgnlmedia.in">
                connect@orgnlmedia.in
            </a>

        </div>

    </div>

</footer>

</body>

</html>
