<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orgnl Media</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@400&display=swap"
        rel="stylesheet">

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
    <link rel="icon" href="assets/favicon/favicon.ico">
    <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="assets/favicon/site.webmanifest">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fff;
            color: #111;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 30vw;
            max-width: 360px;
            min-width: 160px;
            height: auto;
            margin-bottom: 28px;
        }

        h2 {
            font-family: "Montserrat", sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 10px;
        }

        p {
            font-family: "Poppins", sans-serif;
            font-size: 0.75rem;
            color: #8b8b8b;
        }

        @media (min-width: 768px) {

            .logo {
                width: 22vw;
                max-width: 400px;
            }

            h2 {
                font-size: 1.4rem;
            }

            p {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 767px) {

            .logo {
                width: 30vw;
                min-width: 130px;
            }

            h2 {
                font-size: 1rem;
            }

            p {
                font-size: 0.7rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        
        <img src="assets/images/logo.png" alt="Orgnl Media" class="logo">

        <h2>website coming soon.</h2>

        <p>we're busy making some cool content.</p>

    </div>

</body>

</html>
