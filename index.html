<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orgnl Media</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@400&display=swap"
        rel="stylesheet">

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
    <link rel="icon" href="assets/favicon/favicon.ico">
    <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="assets/favicon/site.webmanifest">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fff;
            color: #111;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 30vw;
            max-width: 360px;
            min-width: 160px;
            height: auto;
            margin-bottom: 28px;
        }

        h2 {
            font-family: "Montserrat", sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 10px;
        }

        p {
            font-family: "Poppins", sans-serif;
            font-size: 0.75rem;
            color: #8b8b8b;
        }

        @media (min-width: 768px) {

            .logo {
                width: 22vw;
                max-width: 400px;
            }

            h2 {
                font-size: 1.4rem;
            }

            p {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 767px) {

            .logo {
                width: 30vw;
                min-width: 130px;
            }

            h2 {
                font-size: 1rem;
            }

            p {
                font-size: 0.7rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        
        <img src="assets/images/logo.png" alt="Orgnl Media" class="logo">

        <h2>website coming soon.</h2>

        <p>pakra hai</p>

    </div>

    <!-- PORTFOLIO DOWNLOAD SECTION -->
<section class="portfolio-download">

    <p class="portfolio-line">
        We could tell you we're good.<br>
        but this is probably easier.
    </p>

    <a
        href="assets/portfolio/Orgnl media Portfolio.pdf"
        download
        class="portfolio-button"
        id="portfolioDownload"
    >
        DOWNLOAD PORTFOLIO
        <span class="portfolio-arrow">↓</span>
    </a>


    <style>

        .portfolio-download {
            margin-top: 42px;
            text-align: center;
            font-family: "Poppins", sans-serif;
        }

        .portfolio-line {
            font-family: "Poppins", sans-serif;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #777;
            margin-bottom: 18px;
        }

        .portfolio-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            padding: 14px 22px;

            background: #000;
            color: #fff;

            border: 2px solid #000;
            border-radius: 100px;

            font-family: "Montserrat", sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;

            text-decoration: none;

            transition:
                background 0.25s ease,
                color 0.25s ease,
                transform 0.25s ease;
        }

        .portfolio-arrow {
            font-size: 1rem;
            transition: transform 0.25s ease;
        }

        .portfolio-button:hover {
            background: #fff;
            color: #000;
            transform: translateY(-2px);
        }

        .portfolio-button:hover .portfolio-arrow {
            transform: translateY(3px);
        }

        .portfolio-button:active {
            transform: translateY(0);
        }


        /* Mobile */

        @media (max-width: 767px) {

            .portfolio-download {
                margin-top: 34px;
            }

            .portfolio-line {
                font-size: 0.82rem;
            }

            .portfolio-button {
                padding: 13px 19px;
                font-size: 0.66rem;
            }

        }

    </style>


    <script>

        const portfolioButton =
            document.getElementById("portfolioDownload");

        portfolioButton.addEventListener("click", function () {

            const arrow =
                portfolioButton.querySelector(".portfolio-arrow");

            arrow.textContent = "✓";

            setTimeout(function () {
                arrow.textContent = "↓";
            }, 1800);

        });

    </script>

</section>

</body>

</html>
